name: Build VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Configura CMake (scarica JUCE automaticamente)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compila (Release)
        run: cmake --build build --config Release

      - name: Trova il file .vst3 compilato
        shell: bash
        run: |
          mkdir -p artifact
          find build -iname "*.vst3" -exec cp -r {} artifact/ \;
          ls -la artifact

      - name: Carica il .vst3 come artefatto scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: KeyFinder-VST3-Windows
          path: artifact/**
          if-no-files-found: error
